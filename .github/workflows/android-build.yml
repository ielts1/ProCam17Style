name: Build ProCam17Style V4 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Unpack V4 Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q ProCam17Style_SOURCE_V4.zip -d project
          find project -maxdepth 3 -type f | sort

      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProCam17Style-V4-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
