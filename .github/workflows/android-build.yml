name: Build ProCam17Style V3 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Unpack V3 Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q ProCam17Style_SOURCE_V3.zip -d project

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProCam17Style-V3-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk        uses: actions/upload-artifact@v4
        with:
          name: ProCam17Style-V3-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
